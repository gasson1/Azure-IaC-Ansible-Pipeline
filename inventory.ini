# Tymczasowy inwentarz Ansible - adres IP wpisz po "terraform apply"
# (polecenie: terraform output web_public_ip).
# W kolejnym kroku zastąpimy go inwentarzem generowanym automatycznie.

[web]
vm-web ansible_host=WPISZ_IP_Z_TERRAFORM_OUTPUT

[web:vars]
ansible_user=azureuser
ansible_ssh_private_key_file=~/.ssh/id_rsa
